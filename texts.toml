# ============================================================================
# Словник бота. Максимум рофлів, мінімум поваги до ЄДЕБО.
# ВАЖЛИВО: фігурні дужки {отак} — це змінні. Їх не чіпай, бо все ляже.
# HTML-теги типу <b>текст</b> — для жирного шрифту в ТГ.
# ============================================================================

# ---------------------------------------------------------------- /help
[help]
text = """
🎓 <b>Як працює ця шайтан-машина</b>
Замість того, щоб ворожити на картах таро і молитись на списки, я йду і пробиваю кожного твого конкурента. Якщо якийсь Вася з балом 195 проходить на свій перший пріоритет умовного КПІ — я подумки даю йому копняка з твого списку, бо він тобі більше не загроза. Тільки сухі цифри, ніяких фантазій.

<b>Як юзати:</b>
1. /start — поїхали
2. Кидаєш лінк на свою спеціальність (з abit-poisk.org.ua)
3. Пишеш свій бал (чесно)
4. Обираєш пріоритет (від 1 до 9)
5. Бюджет чи контракт?
6. Йдеш робити чай (чекати десь 1-2 хвилини, бо я реально шмонаю кожного конкурента).

<b>Що за три сценарії?</b>
🔴 Торба (Песимістичний) — якщо всі твої конкуренти тупо лишаться тут і нікуди не звалять.
🟡 База (Очікуваний) — найімовірніший розклад. Рахуємо тих, хто 100% лівне на вищі пріоритети.
🟢 Солодка мрія (Оптимістичний) — якщо всі, хто має хоч мікроскопічний шанс кудись пройти, реально туди втечуть.

<b>Що таке «невизначено»?</b>
Це привиди. Тезки, яких неможливо розрізнити, або просто ЄДЕБО знову лягло і не віддає дані. Я їх виношу окремо, щоб не псувати стату.

<b>Кнопки після результату:</b>
«Список на прокльон» — повне досьє на тих, хто стоїть вище тебе. Можеш починати їх ненавидіти.
«А якщо на контракт?» — те саме, але якщо з бюджетом повний проліт.
«Взяти на радар» — я сам раз на 12 годин чекатиму списки і маякну, якщо щось зміниться. /untrack — відписатись.

/cancel — вирубити поточну дію.
"""

# ------------------------------------------------------- меню команд Telegram
[commands]
start = "Запустити шарманку"
help = "Як це працює"
cancel = "Скасувати все"
