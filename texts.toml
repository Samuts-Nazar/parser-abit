welcome = """👋 Здарова. Я — Калькулятор потужності. 

Твоя остання надія не з'їхати з глузду до серпня. Порахую твій реальний шанс на бюджет (або контракт). Без ілюзій і заспокійливих, тільки хардкорні дані.
Як саме я це рахую — читай у /help.

Для початку кидай лінк на свою спеціальність з abit-poisk.org.ua. 
Типу отак: https://abit-poisk.org.ua/rate2026/direction/1613482"""

