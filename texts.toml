# ============================================================================
# Усі тексти, якими бот спілкується з користувачем — в одному місці.
#
# Це НЕ конфіг і не код: сюди можна вільно міняти слова, речення, жарти чи
# переписати геть усе, і бот підхопить зміни при наступному запуску (bot.py
# читає цей файл один раз при старті). Логіка (хто що рахує, коли яка кнопка
# з'являється) лежить в bot.py й bot_texts.py, тут — лише слова.
#
# Формат: TOML. Секції в квадратних дужках — просто групування по темі,
# кожен рядок усередині — key = "текст". Українською можна писати як завгодно,
# лапки всередині тексту заміняй на інші (« », ' ' — що зручно), або став \"
# перед лапкою. Для тексту в кілька рядків — потрійні лапки \"\"\"...\"\"\".
#
# ВАЖЛИВО: фігурні дужки {отак} — це місця, куди бот підставляє живі дані
# (ім'я, бал, число тощо). Їх треба залишити на місці з тим самим словом
# усередині (наприклад {name}, {score}) — інакше бот впаде з помилкою.
# Все інше — переписуй як завгодно, довжина рядків і кількість не важливі,
# крім списку жартів (jokes.nothing_changed) — там можна додавати чи
# прибирати рядки скільки завгодно, це список.
#
# HTML-теги на кшталт <b>...</b> — це жирний шрифт у Telegram. Можна лишити,
# прибрати чи переставити, головне щоб кожен <b> мав пару </b>.
# ============================================================================


# ---------------------------------------------------------------- /help
[help]
text = """
🎓 <b>Що робить Калькулятор потужності</b>
Показує не просто місце в рейтинговому списку, а реальний шанс пройти — з урахуванням того, що частина людей вище за балом можуть піти на свій вищий пріоритет і звільнити місце тут. Без ворожіння на кавовій гущі — тільки цифри з реальних даних сайту.

<b>Як користуватись</b>
1. /start — почати
2. Надіслати посилання на напрям (abit-poisk.org.ua)
3. Вказати свій бал
4. Обрати пріоритет заяви на цю спеціальність (кнопками)
5. Обрати бюджет чи контракт (кнопками)
6. Дочекатись аналізу (до ~2 хв — бот перевіряє кожного конкурента вище окремо, тому не миттєво)

<b>Що означають три сценарії</b>
🔴 Найгірший — якщо ніхто з конкурентів вище нікуди не піде
🟡 Очікувано — зважена оцінка, скільки з них реально підуть на вищий пріоритет
🟢 Найкращий — якщо всі, хто може піти, підуть

<b>Що таке «невизначено»</b>
Частину людей не вдалось перевірити напевно — у когось іншого знайшлось таке саме ім'я та прізвище (і незрозуміло, хто з них саме той) або сайт не відповів. Це чесно показується окремо, а не ховається у «підуть» чи «лишаються».

<b>Кнопки після результату</b>
«Хто саме вище мене» — повний список конкурентів вище твого балу і що з кожним
«Шанс на контракт» — той самий розрахунок, але для контрактних місць
«Стежити» — раз на 12 год сам перерахую і напишу, якщо щось зміниться (а якщо ні — просто щось зажартую). /untrack — зупинити стеження

Усе — детермінований розрахунок з реальних даних сайту, без ШІ.
/cancel — скасувати поточний діалог.
"""

# ------------------------------------------------------- меню команд Telegram
[commands]
start = "Почати новий аналіз"
help = "Що це і як користуватись"
cancel = "Скасувати поточний діалог"
untrack = "Зупинити стеження"

