welcome = """👋 Привіт, тут Калькулятор потужності. Порахую реальний шанс пройти на бюджет (і на контракт) на обрану спеціальність — без істерики, самі цифри.

Що саме і як рахується — /help.

Надішли посилання на напрям з abit-poisk.org.ua, напр.:
https://abit-poisk.org.ua/rate2026/direction/1613482"""

